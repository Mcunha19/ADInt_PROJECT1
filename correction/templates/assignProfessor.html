{% extends 'layout.html' %}

{% block content %}
<h1 class="h3 mb-3">Professor assignments</h1>
<form method="post" class="row g-3 align-items-end mb-4">
    <div class="col-sm-4 col-lg-3">
        <label class="form-label" for="exam-id">Exam ID</label>
        <input class="form-control" id="exam-id" name="exam_id" type="number" min="1" required>
    </div>
    <div class="col-sm-4 col-lg-3">
        <label class="form-label" for="professor-id">Professor ID</label>
        <input class="form-control" id="professor-id" name="professor_id" type="number" min="1" required>
    </div>
    <div class="col-sm-4 col-lg-3">
        <label class="form-label" for="question-number">Question</label>
        <select class="form-select" id="question-number" name="question_number" required>
            <option value="1">Question 1</option>
            <option value="2">Question 2</option>
            <option value="3">Question 3</option>
            <option value="4">Question 4</option>
        </select>
    </div>
    <div class="col-lg-3"><button class="btn btn-primary" type="submit">Save assignment</button></div>
</form>

<h2 class="h5">Current assignments</h2>
<div class="table-responsive">
    <table class="table table-striped align-middle">
        <thead><tr><th>Exam</th><th>Question</th><th>Professor</th></tr></thead>
        <tbody>
        {% for assignment in assignments %}
            <tr><td>{{ assignment.exam_id }}</td><td>{{ assignment.question_number }}</td><td>{{ assignment.prof_id }}</td></tr>
        {% else %}
            <tr><td colspan="3" class="text-secondary">No assignments yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
