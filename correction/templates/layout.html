<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Correction Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Correction Service</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('assignProfessor') }}">Assign professor</a>
                <a class="nav-link" href="{{ url_for('upload_pdf') }}">Upload scans</a>
                <a class="nav-link" href="{{ url_for('assigned_resolutions') }}">Pages to correct</a>
                <a class="nav-link" href="{{ url_for('corrected_answers') }}">Corrected pages</a>
                <a class="nav-link" href="{{ url_for('exam_scans') }}">Scans and grades</a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
