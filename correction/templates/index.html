{% extends 'layout.html' %}

{% block content %}
<h1 class="h3 mb-4">Correction overview</h1>
<div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-3"><div class="border rounded p-3"><div class="text-secondary">Assignments</div><strong class="fs-4">{{ assignment_count }}</strong></div></div>
    <div class="col-sm-6 col-lg-3"><div class="border rounded p-3"><div class="text-secondary">Uploaded exams</div><strong class="fs-4">{{ pdf_count }}</strong></div></div>
    <div class="col-sm-6 col-lg-3"><div class="border rounded p-3"><div class="text-secondary">Question pages</div><strong class="fs-4">{{ question_count }}</strong></div></div>
    <div class="col-sm-6 col-lg-3"><div class="border rounded p-3"><div class="text-secondary">Corrected</div><strong class="fs-4">{{ corrected_count }}</strong></div></div>
</div>
<div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" href="{{ url_for('assignments') }}">Manage assignments</a>
    <a class="btn btn-outline-primary" href="{{ url_for('upload_pdf') }}">Upload exam scans</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('exam_scans') }}">Review anonymous scans</a>
</div>
{% endblock %}
