{% extends 'layout.html' %}

{% block content %}
<h1 class="h3 mb-3">Order resolution sheets</h1>
<form action="{{ url_for('orderPrintingSheets') }}" method="post" class="row g-3 align-items-end" style="max-width: 640px">
    <div class="col-sm-8">
        <label class="form-label" for="exam-id">Exam ID</label>
        <input class="form-control" id="exam-id" type="number" name="examId" min="1" step="1" required>
    </div>
    <div class="col-sm-4"><button class="btn btn-primary" type="submit">Order sheets</button></div>
</form>
{% if printSuccess is defined %}
    <div class="alert alert-{{ 'success' if printSuccess else 'danger' }} mt-3" role="status">
        {{ 'Printing order completed.' if printSuccess else 'Printing order failed.' }}
    </div>
{% endif %}
{% endblock %}
