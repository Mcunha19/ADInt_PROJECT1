{% extends 'layout.html' %}

{% block content %}
    <div class="container py-4">
        <h1 class="h3 mb-3">Order Printing Sheets</h1>
        <form action="orderPrintingSheets" method="post" id="printing-form">
                <div class="row g-2 align-items-end enrollment-row mb-3">
                    <div class="col-sm-5">
                        <label class="form-label">Exam ID</label>
                        <input class="form-control" type="number" name="examId" min="1" step="1" required>
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Order Printing Sheets</button>
        </form>
    </div>

{% endblock %}
