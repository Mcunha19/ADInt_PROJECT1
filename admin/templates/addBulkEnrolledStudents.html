{% extends 'layout.html' %}

{% block content %}
<h1 class="h3 mb-3">Enroll students in an exam</h1>
<p class="text-secondary">CSV columns: <code>user_id</code>, <code>exam_id</code>.</p>
<form action="{{ url_for('addBulkEnrolledStudents') }}" method="post" enctype="multipart/form-data" class="row g-3" style="max-width: 640px">
    <div class="col-12">
        <label class="form-label" for="csv-file">Enrollment CSV</label>
        <input class="form-control" id="csv-file" type="file" name="csv_file" accept=".csv,text/csv" required>
    </div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Import enrollments</button></div>
</form>
{% endblock %}
