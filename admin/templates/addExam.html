{% extends 'layout.html' %}

{% block content %}
<h1 class="h3 mb-3">Schedule exam</h1>
<form action="{{ url_for('addExam') }}" method="post" class="row g-3" style="max-width: 640px">
    <div class="col-12">
        <label class="form-label" for="course">Course</label>
        <input class="form-control" id="course" name="course" type="text" required>
    </div>
    <div class="col-12">
        <label class="form-label" for="date">Date and time</label>
        <input class="form-control" type="datetime-local" id="date" name="date" required>
    </div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Save exam</button></div>
</form>
{% endblock %}
